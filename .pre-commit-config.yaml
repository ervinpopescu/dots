# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
        exclude: (\.tmpl$|VSCodium/)
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Nix — format changed modules, evaluate every output, and execute the
  # manifest backup/restore behavior check on the current host platform.
  - repo: local
    hooks:
      - id: nixfmt
        name: nixfmt
        language: system
        entry: nix fmt --
        files: \.nix$
        types: [file]
      - id: nix-flake-check
        name: nix flake check (evaluation)
        language: system
        entry: nix flake check --impure --all-systems --no-build
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.sops\.yaml|flake\.(nix|lock)|nix/|secrets/|dot_(agents|claude|config|jq|pi)(/|$)|bin/|private_dot_(local|ssh)/|system/)
      - id: home-manager-backup-restore-test
        name: Home Manager backup/restore behavior
        language: system
        entry: >-
          bash -eu -o pipefail -c 'system=$(nix eval --impure --raw --expr
          builtins.currentSystem); nix build
          ".#checks.${system}.home-manager-backup-restore" --no-link'
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|flake\.(nix|lock)|nix/home/profiles/common\.nix|nix/lib/home-manager-tools\.nix|nix/scripts/(darwin-switch|hm-(backup-collision|check-collisions|link-no-clobber|preflight|restore-collisions|rm-no-clobber|switch))\.sh|nix/scripts/hm-(link-atomic|rename-no-replace)\.c)$
      - id: rendered-shellcheck
        name: ShellCheck rendered executable templates
        language: system
        entry: >-
          bash -eu -o pipefail -c 'system=$(nix eval --impure --raw --expr
          builtins.currentSystem); nix build
          ".#checks.${system}.rendered-shells" --no-link'
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|flake\.(nix|lock)|run_(after_system-deploy|onchange_install-deps)\.sh\.tmpl|dot_claude/executable_statusline\.sh\.tmpl|bin/executable_(netspeed|volctl|wallpaper|wallpaper-wl)\.sh\.tmpl|nix/lib/(profiles|rendered-bin)\.nix|nix/home/profiles/(agents|legacy-static)\.nix)$

  # Python — qtile / qtile-wl / bin scripts
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--line-length=98]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix]

  # Lua — neovim config
  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.1.0
    hooks:
      - id: stylua
        args: [--config-path=dot_config/nvim/stylua.toml]

  # JSON — sort keys, then apply Prettier's stable layout in the same pass.
  - repo: local
    hooks:
      - id: jq-sort-keys
        name: jq sort keys
        language: system
        entry: >-
          bash -eu -o pipefail -c 'for f in "$@"; do
          jq -S . "$f" | prettier --parser json > "$f.tmp";
          chmod --reference="$f" "$f.tmp"; mv "$f.tmp" "$f"; done' --
        types: [json]
        exclude: (\.tmpl$|VSCodium/|\.luarc\.json$)

  # JSON / Markdown / CSS / JS / YAML — prettier (system install)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: prettier --write
        types_or: [json, markdown, css, javascript, yaml]
        exclude: (\.tmpl$|VSCodium/|focus_history\.json)

  # Markdown linting (system install: markdownlint-cli2 from AUR)
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2
        language: system
        entry: markdownlint-cli2 --config .markdownlint.yaml
        types: [markdown]

  # Shell scripts
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        exclude: (^system/|\.zsh$|\.tmpl$)
        args: [--severity=warning]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.11.0-1
    hooks:
      - id: shfmt
        args: [-i=2, -ci]

  # Secrets
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
