server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    more_clear_headers Server;
    server_name studio.laura-photos.com;

    ssl_certificate /etc/letsencrypt/live/aslan.archnet.lol/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aslan.archnet.lol/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/snippets/security-headers.conf;

    root /var/www;

    # Direct root visit to the studio route
    location = / {
        return 302 /studio;
    }

    # Redirect any accidental /laura-web/* visits back to root
    if ($request_uri ~* ^/laura-web/?$) {
        return 301 /studio;
    }
    if ($request_uri ~* ^/laura-web/(?!api/)(.*)$) {
        return 301 /$1;
    }

    # Internally mount the subpath build at root
    rewrite ^/(?!$)(?!laura-web(?:/|$))(?!api/gallery-v1(?:/|$))(.*)$ /laura-web/$1 last;

    location = /laura-web {
        root /var/www;
        try_files /laura-web/index.html =404;
    }

    location /laura-web/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /laura-web/index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 256;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

        location = /laura-web/index.html {
            expires 0;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            include /etc/nginx/snippets/security-headers.conf;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    # Gallery API proxy
    location ^~ /laura-web/api/gallery-v1/ {
        limit_req zone=api_sensitive burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787/api/gallery-v1/;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 260M;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/gallery-v1/ {
        limit_req zone=api_sensitive burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787/api/gallery-v1/;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 260M;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page 400 /error/400.html;
    error_page 404 /error/404.html;
    error_page 500 /error/500.html;
    error_page 502 /error/502.html;
    error_page 503 /error/503.html;
    error_page 504 /error/504.html;
    location ^~ /error/ {
        root /www/data;
        internal;
    }
}
