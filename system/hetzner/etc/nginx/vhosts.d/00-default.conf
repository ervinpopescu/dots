# Internal status endpoint for prometheus-nginx-exporter
server {
    listen 80;
    listen 127.0.0.1:8088;
    server_name 127.0.0.1 localhost;
    access_log off;

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}

# Redirect HTTP to HTTPS for web hosts.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name aslan.archnet.lol archen.archnet.lol sftp.archnet.lol laura-photos.com www.laura-photos.com studio.laura-photos.com studio.archnet.lol;
    return 301 https://$host$request_uri;
}

# ssh.archnet.lol is reserved for SSH on TCP/22. Reject web traffic
# explicitly instead of falling through to another virtual host.
server {
    listen 80;
    listen [::]:80;
    server_name ssh.archnet.lol;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name ssh.archnet.lol;
    ssl_reject_handshake on;
}
