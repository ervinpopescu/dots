# ==============================================================================
# Solux Security Headers & Least-Permissive Content Security Policy (CSP)
# Included in every Solux location setting Cache-Control to prevent add_header
# inheritance loss in Nginx.
# ==============================================================================

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;

# Least-permissive CSP:
# - scripts: 'self' only
# - styles: 'self' and 'unsafe-inline' (required for MapLibre dynamic map canvas/style injection)
# - images & fonts: 'self', data:, blob:, OpenFreeMap tiles/glyphs
# - connections: 'self', blob:, OpenFreeMap tiles, Nominatim search, Overpass building APIs
# - workers: 'self', blob: (required for MapLibre blob workers via URL.createObjectURL)
# - frame/object: denied
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org; font-src 'self' data: https://tiles.openfreemap.org; connect-src 'self' blob: https://tiles.openfreemap.org https://nominatim.openstreetmap.org https://overpass-api.de https://overpass.kumi.systems https://overpass.private.coffee; worker-src 'self' blob:; child-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;
