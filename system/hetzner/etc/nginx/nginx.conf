load_module "/usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so";
#user http;
worker_processes 1;

error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    client_max_body_size 64M; # needed to upload large books

    # Cloudflare Real-IP
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Structured JSON Logging with Cloudflare Metadata
    log_format cf_json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","cf_ray":"$http_cf_ray",'
      '"host":"$host","request_method":"$request_method","request_uri":"$request_uri",'
      '"status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time","upstream_status":"$upstream_status",'
      '"http_referrer":"$http_referer","http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.json.log cf_json;

    # Security Headers
    include /etc/nginx/snippets/security-headers.conf;

    # This is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Calibre must only be reachable through a Cloudflare proxy. This checks
    # the actual TCP peer preserved by ngx_http_realip_module, not a header.
    geo $realip_remote_addr $calibre_cloudflare_peer {
        default 0;

        # Cloudflare IPv4 proxy ranges.
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;

        # Cloudflare IPv6 proxy ranges.
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }

    # Redirect HTTP to HTTPS for web hosts.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name aslan.archnet.lol archen.archnet.lol sftp.archnet.lol laura-photos.com www.laura-photos.com;
        return 301 https://$host$request_uri;
    }

    # ssh.archnet.lol is reserved for SSH on TCP/22. Reject web traffic
    # explicitly instead of falling through to another virtual host.
    server {
        listen 80;
        listen [::]:80;
        server_name ssh.archnet.lol;
        return 444;
    }

    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        server_name ssh.archnet.lol;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        more_clear_headers Server;
        server_name sftp.archnet.lol;

        ssl_certificate /etc/ssl/certs/sftp.archnet.lol-origin.pem;
        ssl_certificate_key /etc/ssl/private/sftp.archnet.lol-origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://127.0.0.1:3022/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            # Access authenticates at the edge; the app verifies this JWT.
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        more_clear_headers Server;
        server_name laura-photos.com www.laura-photos.com;

        ssl_certificate /etc/letsencrypt/live/aslan.archnet.lol/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aslan.archnet.lol/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        include /etc/nginx/snippets/security-headers.conf;

        root /var/www;

        # Explicitly redirect /admin to /admin/ before internal rewrite to prevent
        # Nginx directory redirection from exposing the internal /laura-web/ prefix.
        location = /admin {
            return 301 /admin/;
        }

        # Redirect any accidental /laura-web/* visits on laura-photos.com back to root /*
        if ($request_uri ~* ^/laura-web/?$) {
            return 301 /;
        }
        if ($request_uri ~* ^/laura-web/(?!api/)(.*)$) {
            return 301 /$1;
        }

        # Internally mount the subpath build at root while keeping the browser URL clean
        rewrite ^/(?!laura-web(?:/|$))(?!api/gallery-v1(?:/|$))(?!admin$)(.*)$ /laura-web/$1 last;

        location = /laura-web {
            root /var/www;
            try_files /laura-web/index.html =404;
        }

        location /laura-web/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /laura-web/index.html;

            gzip on;
            gzip_vary on;
            gzip_min_length 256;
            gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

            location = /laura-web/index.html {
                expires 0;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                include /etc/nginx/snippets/security-headers.conf;
            }

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
                expires 1y;
                add_header Cache-Control "public, no-transform";
                include /etc/nginx/snippets/security-headers.conf;
            }
        }

        # Gallery API proxy
        location ^~ /laura-web/api/gallery-v1/ {
            proxy_pass http://127.0.0.1:8787/api/gallery-v1/;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 260M;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /api/gallery-v1/ {
            proxy_pass http://127.0.0.1:8787/api/gallery-v1/;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_read_timeout 300s;
            client_max_body_size 260M;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        error_page 400 /error/400.html;
        error_page 404 /error/404.html;
        error_page 500 /error/500.html;
        error_page 502 /error/502.html;
        error_page 503 /error/503.html;
        error_page 504 /error/504.html;
        location ^~ /error/ {
            root /www/data;
            internal;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        listen [::]:443 ssl default_server;
        more_clear_headers Server;
        server_name aslan.archnet.lol;

        ssl_certificate /etc/letsencrypt/live/aslan.archnet.lol/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aslan.archnet.lol/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            root /www/data;
            index index.html index.htm;
            add_header Cache-Control 'no-store';
            add_header Cache-Control 'no-cache';
            include /etc/nginx/snippets/security-headers.conf;
            expires 0;
        }

        error_page 400 /error/400.html;
        error_page 404 /error/404.html;
        error_page 500 /error/500.html;
        error_page 502 /error/502.html;
        error_page 503 /error/503.html;
        error_page 504 /error/504.html;
        location ^~ /error/ {
            root /www/data;
            internal;
        }

        set $radarr 127.0.0.1:7878;
        set $calibre 127.0.0.1:8080;
        set $jellyfin 127.0.0.1:8096;
        set $sonarr 127.0.0.1:8989;
        set $grafana 127.0.0.1:3000;
        include /etc/nginx/conf.d/*.conf;
    }
}
