load_module "/usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so";
#user http;
worker_processes 1;

error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    client_max_body_size 64M; # needed to upload large books

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: wss: ws: https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https: wss: ws:;" always;

    # This is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Calibre must only be reachable through a Cloudflare proxy. This checks
    # the actual TCP peer preserved by ngx_http_realip_module, not a header.
    geo $realip_remote_addr $calibre_cloudflare_peer {
        default 0;

        # Cloudflare IPv4 proxy ranges.
        173.245.48.0/20 1;
        103.21.244.0/22 1;
        103.22.200.0/22 1;
        103.31.4.0/22 1;
        141.101.64.0/18 1;
        108.162.192.0/18 1;
        190.93.240.0/20 1;
        188.114.96.0/20 1;
        197.234.240.0/22 1;
        198.41.128.0/17 1;
        162.158.0.0/15 1;
        104.16.0.0/13 1;
        104.24.0.0/14 1;
        172.64.0.0/13 1;
        131.0.72.0/22 1;

        # Cloudflare IPv6 proxy ranges.
        2400:cb00::/32 1;
        2606:4700::/32 1;
        2803:f800::/32 1;
        2405:b500::/32 1;
        2405:8100::/32 1;
        2a06:98c0::/29 1;
        2c0f:f248::/32 1;
    }

    # Redirect HTTP to HTTPS for web hosts.
    server {
        listen 80;
        listen [::]:80;
        server_name aslan.archnet.lol archen.archnet.lol sftp.archnet.lol;
        return 301 https://$host$request_uri;
    }

    # ssh.archnet.lol is reserved for SSH on TCP/22. Reject web traffic
    # explicitly instead of falling through to another virtual host.
    server {
        listen 80;
        listen [::]:80;
        server_name ssh.archnet.lol;
        return 444;
    }

    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        server_name ssh.archnet.lol;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        more_clear_headers Server;
        server_name sftp.archnet.lol;

        ssl_certificate /etc/ssl/certs/sftp.archnet.lol-origin.pem;
        ssl_certificate_key /etc/ssl/private/sftp.archnet.lol-origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://127.0.0.1:3022/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            # Access authenticates at the edge; the app verifies this JWT.
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        more_clear_headers Server;
        server_name aslan.archnet.lol;

        ssl_certificate /etc/letsencrypt/live/aslan.archnet.lol/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aslan.archnet.lol/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            root /www/data;
            index index.html index.htm;
            add_header Cache-Control 'no-store';
            add_header Cache-Control 'no-cache';
            expires 0;
        }

        error_page 400 /error/400.html;
        error_page 404 /error/404.html;
        error_page 500 /error/500.html;
        error_page 502 /error/502.html;
        error_page 503 /error/503.html;
        error_page 504 /error/504.html;
        location ^~ /error/ {
            root /www/data;
            internal;
        }

        set $radarr 127.0.0.1:7878;
        set $calibre 127.0.0.1:8080;
        set $jellyfin 127.0.0.1:8096;
        set $sonarr 127.0.0.1:8989;
        set $grafana 127.0.0.1:3000;
        include /etc/nginx/conf.d/*.conf;
    }
}
