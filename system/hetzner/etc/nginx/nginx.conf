load_module "/usr/lib/nginx/modules/ngx_http_headers_more_filter_module.so";
#user http;
worker_processes 1;

error_log /var/log/nginx/error.log;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    client_max_body_size 64M; # needed to upload large books

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: wss: ws: https://unpkg.com https://www.googletagmanager.com https://www.google-analytics.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https: wss: ws:;" always;

    # This is required to proxy Grafana Live WebSocket connections.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name aslan.archnet.lol archen.archnet.lol;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        more_clear_headers Server;
        server_name aslan.archnet.lol;

        ssl_certificate /etc/letsencrypt/live/aslan.archnet.lol/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aslan.archnet.lol/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            root /www/data;
            index index.html index.htm;
            add_header Cache-Control 'no-store';
            add_header Cache-Control 'no-cache';
            expires 0;
        }

        error_page 400 /error/400.html;
        error_page 404 /error/404.html;
        error_page 500 /error/500.html;
        error_page 502 /error/502.html;
        error_page 503 /error/503.html;
        error_page 504 /error/504.html;
        location ^~ /error/ {
            root /www/data;
            internal;
        }

        set $radarr 127.0.0.1:7878;
        set $calibre 127.0.0.1:8080;
        set $jellyfin 127.0.0.1:8096;
        set $sonarr 127.0.0.1:8989;
        set $transmission 127.0.0.1:9091;
        set $grafana 127.0.0.1:3000;
        include /etc/nginx/conf.d/*.conf;
    }
}
