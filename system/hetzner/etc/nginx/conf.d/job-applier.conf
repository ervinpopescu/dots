# Job Applier Web Dashboard (https://github.com/ervinpopescu/job-applier)
# Unified dashboard for scraping, AI tailoring (Gemini), and automated applications.
# Upstream FastAPI / Uvicorn server running on 127.0.0.1:8000.

# Optional custom hostname rewrite (e.g. jobs.archnet.lol or job-applier.archnet.lol)
if ($host ~* ^(jobs|job-applier)\.archnet\.lol$) {
    rewrite ^/(?!job-applier(?:/|$))(.*)$ /job-applier/$1 last;
}

# Redirect root/vanity shortcuts to canonical subpath
location = /jobs {
    return 301 /job-applier/;
}

location = /jobs/ {
    return 301 /job-applier/;
}

location = /job-applier {
    return 301 /job-applier/;
}

location ^~ /job-applier/ {
    proxy_pass http://127.0.0.1:8000/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /job-applier;

    # WebSocket / SSE support if needed
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Timeouts & buffering: allow long-running operations (pruning, uploads, exports)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    client_max_body_size 64M;

    proxy_redirect / /job-applier/;

    # Security & CSP headers tailored for Job Applier
    # Allows CDN scripts/styles (Tailwind, Alpine.js, Lucide) and embedded PDF preview
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://unpkg.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.tailwindcss.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' data: blob: https: wss: ws:; frame-src 'self' data: blob:; frame-ancestors 'self' https://aslan.archnet.lol" always;

    # Rewrite root-relative asset and API paths in HTML, JSON, and JS
    # so that the entire Job Applier interface operates seamlessly under /job-applier/
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/json application/javascript text/javascript;
    sub_filter_once off;

    # API endpoints and file storage paths
    sub_filter '"/api/' '"/job-applier/api/';
    sub_filter "'/api/" "'/job-applier/api/";
    sub_filter '`/api/' '`/job-applier/api/';
    sub_filter '"/files/' '"/job-applier/files/';
    sub_filter "'/files/" "'/job-applier/files/";
    sub_filter '`/files/' '`/job-applier/files/';

    # Angular SPA support if compiled build is mounted
    sub_filter '<base href="/"' '<base href="/job-applier/"';
    sub_filter 'href="favicon.ico"' 'href="/job-applier/favicon.ico"';
    sub_filter 'src="/main' 'src="/job-applier/main';
    sub_filter 'src="/polyfills' 'src="/job-applier/polyfills';
    sub_filter 'src="/styles' 'src="/job-applier/styles';
    sub_filter 'src="/runtime' 'src="/job-applier/runtime';
    sub_filter 'href="/styles' 'href="/job-applier/styles';
}
