# Laura Galleries API for the existing HTTPS aslan virtual host.
# This file is included inside the host's server block by /etc/nginx/nginx.conf.
location ^~ /laura-web/api/gallery-v1/ {
    proxy_pass http://127.0.0.1:8787/api/gallery-v1/;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 260M;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
