# Probe the native RPC challenge internally; never expose its auth response/body.
location = /health/transmission {
    limit_except GET { deny all; }
    proxy_connect_timeout 2s;
    proxy_read_timeout 2s;
    proxy_send_timeout 2s;
    proxy_http_version 1.1;
    proxy_method HEAD;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_hide_header Content-Length;
    proxy_intercept_errors on;
    error_page 401 403 409 =204 @health_transmission_ok;
    proxy_pass http://aslan.home.ro:9091/transmission/rpc;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
}

location @health_transmission_ok {
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
    return 204;
}

# Transmission Web UI and RPC hosted on the home server.
location = /transmission {
    return 301 /transmission/;
}

location ^~ /transmission/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_header X-Transmission-Session-Id;
    proxy_pass http://aslan.home.ro:9091/transmission/;
}
