proxy_set_header X-Forwarded-For $remote_addr;
# Calibre has no native status-only health contract. Keep its public status
# honestly Restricted rather than exposing its library or bypassing Access.
location = /health/calibre {
    limit_except GET { deny all; }
    if ($calibre_cloudflare_peer = 0) { return 403; }
    if ($http_cf_access_jwt_assertion = "") { return 403; }
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
    return 403;
}

location /calibre/ {
    # Access is the user-authentication boundary. Reject direct-origin
    # requests whose TCP peer is not a Cloudflare proxy or lack Cloudflare Access JWT.
    if ($calibre_cloudflare_peer = 0) {
        return 403;
    }
    if ($http_cf_access_jwt_assertion = "") {
        return 403;
    }
    proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
    proxy_buffering off;
    proxy_pass http://$calibre/$request_uri;
}
location /calibre {
    # we need a trailing slash for the Application Cache to work
    if ($calibre_cloudflare_peer = 0) {
        return 403;
    }
    if ($http_cf_access_jwt_assertion = "") {
        return 403;
    }
    rewrite /calibre /calibre/ permanent;
}
