# Lavish review sessions under the existing HTTPS virtual host.
# The Lavish client uses a few absolute asset/API paths, so proxy those too.

location = /lavish {
    return 301 /lavish/;
}

location ^~ /lavish/ {
    proxy_pass http://127.0.0.1:4387/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_buffering off;
    include /etc/nginx/snippets/lavish-response-headers.conf;
}

location = /chrome.css { proxy_pass http://127.0.0.1:4387; include /etc/nginx/snippets/lavish-proxy-headers.conf; }
location = /chrome-client.js { proxy_pass http://127.0.0.1:4387; include /etc/nginx/snippets/lavish-proxy-headers.conf; }
location ^~ /artifact/ {
    proxy_pass http://127.0.0.1:4387;
    include /etc/nginx/snippets/lavish-proxy-headers.conf;
    include /etc/nginx/snippets/lavish-response-headers.conf;
}
location ^~ /api/ { proxy_pass http://127.0.0.1:4387; include /etc/nginx/snippets/lavish-proxy-headers.conf; }
location ^~ /events/ { proxy_pass http://127.0.0.1:4387; include /etc/nginx/snippets/lavish-proxy-headers.conf; }
location = /artifact-failures { proxy_pass http://127.0.0.1:4387; include /etc/nginx/snippets/lavish-proxy-headers.conf; }
location ^~ /artifact-loads/ { proxy_pass http://127.0.0.1:4387; include /etc/nginx/snippets/lavish-proxy-headers.conf; }
location ^~ /feedback-files { proxy_pass http://127.0.0.1:4387; include /etc/nginx/snippets/lavish-proxy-headers.conf; }
