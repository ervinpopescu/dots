# Lavish review sessions under the existing HTTPS virtual host.
# Keep the complete Lavish surface behind /lavish. The upstream application
# uses absolute browser paths, so the response filters below add the prefix.

location = /lavish {
    return 301 /lavish/;
}

location ^~ /lavish/session/ {
    proxy_pass http://127.0.0.1:4387/session/;
    include /etc/nginx/snippets/lavish-proxy-headers.conf;
    include /etc/nginx/snippets/lavish-response-headers.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter 'src="/artifact/' 'src="/lavish/artifact/';
    sub_filter 'href="/chrome.css' 'href="/lavish/chrome.css';
    sub_filter 'src="/chrome-client.js' 'src="/lavish/chrome-client.js';
}

location = /lavish/sdk.js {
    proxy_pass http://127.0.0.1:4387/sdk.js;
    include /etc/nginx/snippets/lavish-proxy-headers.conf;
}

location = /lavish/chrome.css {
    proxy_pass http://127.0.0.1:4387/chrome.css;
    include /etc/nginx/snippets/lavish-proxy-headers.conf;
}

location = /lavish/chrome-client.js {
    proxy_pass http://127.0.0.1:4387/chrome-client.js;
    include /etc/nginx/snippets/lavish-proxy-headers.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter_types application/javascript;
    sub_filter_once off;
    sub_filter '/api/' '/lavish/api/';
    sub_filter '/events/' '/lavish/events/';
    sub_filter '/artifact/' '/lavish/artifact/';
    sub_filter '/artifact-failures' '/lavish/artifact-failures';
    sub_filter '/artifact-loads/' '/lavish/artifact-loads/';
    sub_filter '/feedback-files' '/lavish/feedback-files';
    sub_filter '/whiteboard-frame' '/lavish/whiteboard-frame';
    sub_filter '/whiteboard/' '/lavish/whiteboard/';
}

location ^~ /lavish/artifact/ {
    proxy_pass http://127.0.0.1:4387/artifact/;
    include /etc/nginx/snippets/lavish-proxy-headers.conf;
    include /etc/nginx/snippets/lavish-response-headers.conf;
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter 'src="/sdk.js?' 'src="/lavish/sdk.js?';
}

location ^~ /lavish/ {
    proxy_pass http://127.0.0.1:4387/;
    include /etc/nginx/snippets/lavish-proxy-headers.conf;
    include /etc/nginx/snippets/lavish-response-headers.conf;
}
