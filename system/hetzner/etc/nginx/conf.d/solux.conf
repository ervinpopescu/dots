# ==============================================================================
# Solux - Golden Hour Map & Solar Phase PWA
# Direct static hosting via Nginx from /var/www/solux
# ==============================================================================

# Exact path redirect: /solux -> /solux/ (301 Moved Permanently)
location = /solux {
    return 301 /solux/;
}

# Main application root and SPA fallback
location ^~ /solux/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /solux/index.html;

    # Moderate safe gzip compression
    gzip on;
    gzip_static on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/xml;

    include /etc/nginx/snippets/solux-security-headers.conf;

    # Immutable cache only for hashed asset bundles (JS, CSS, fonts in /solux/assets/)
    location /solux/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/solux-security-headers.conf;
    }

    # PWA entrypoint HTML: never cache, always revalidate to discover new builds
    location = /solux/index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/solux-security-headers.conf;
    }

    # PWA service worker, registration scripts, and web app manifest:
    # Must revalidate immediately so clients never run stale worker or manifest logic
    location ~* ^/solux/(?:sw\.js|registerSW\.js|workbox-[a-f0-9]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        include /etc/nginx/snippets/solux-security-headers.conf;
    }
}
