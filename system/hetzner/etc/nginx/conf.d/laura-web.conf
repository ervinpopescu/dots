# Laura Photography subpath mount and API routing on aslan.archnet.lol

# Bare subpath redirect for admin to ensure trailing slash
location = /laura-web/admin {
    return 301 /laura-web/admin/;
}

# Bare subpath redirect for SPA
location = /laura-web {
    root /var/www;
    try_files /laura-web/index.html =404;
}

# Main SPA routing and static assets
location /laura-web/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/index.html /laura-web/index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location = /laura-web/index.html {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

# Gallery API proxy
location ^~ /laura-web/api/gallery-v1/ {
    limit_req zone=api_sensitive burst=10 nodelay;
    proxy_pass http://127.0.0.1:8787/api/gallery-v1/;
    proxy_http_version 1.1;
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 260M;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
