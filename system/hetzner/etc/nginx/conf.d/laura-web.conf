# Internally mount the existing subpath build at the custom domain root.
# The browser keeps laura-photos.com while the origin serves /laura-web.
if ($host = laura-photos.com) {
    rewrite ^/(?!laura-web(?:/|$))(.*)$ /laura-web/$1 last;
}

if ($host = www.laura-photos.com) {
    rewrite ^/(?!laura-web(?:/|$))(.*)$ /laura-web/$1 last;
}

location = /laura-web {
    root /var/www;
    try_files /laura-web/index.html =404;
}

location /laura-web/ {
    root /var/www;
    index index.html;
    try_files $uri $uri/ /laura-web/index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location = /laura-web/index.html {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Cache static assets (JS, CSS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}
