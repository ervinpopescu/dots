[Unit]
Description=Transmission BitTorrent Daemon
Wants=network-online.target
After=network-online.target

[Service]
User=ervin
Environment=TRANSMISSION_WEB_HOME=/usr/share/transmission/public_html
ExecStart=
ExecStart=/usr/bin/transmission-daemon -f -g /home/ervin/.config/transmission-daemon --log-level=error --logfile /home/ervin/.local/share/transmission.log
; ExecStart=/usr/bin/transmission-daemon -f -g /home/ervin/.config/transmission-daemon --log-level=debug --logfile /home/ervin/.local/share/transmission.log
ExecReload=/bin/kill -s HUP $MAINPID
NoNewPrivileges=true
MemoryDenyWriteExecute=true
ProtectSystem=true
PrivateTmp=true
